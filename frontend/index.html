<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <!-- Default SEO (overridden per page by react-helmet-async) -->
    <title>NATA — National Association of Tattoo Artists</title>
    <meta
      name="description"
      content="NATA provides tattoo artists and piercers nationwide with health insurance, life insurance, and exclusive membership benefits."
    />
    <meta
      name="keywords"
      content="tattoo artist insurance, tattoo association, NATA, tattoo artist benefits, piercer insurance"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nata.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NATA" />
    <meta
      property="og:title"
      content="NATA — National Association of Tattoo Artists"
    />
    <meta
      property="og:description"
      content="Health insurance, life insurance, and exclusive benefits for tattoo artists and piercers nationwide."
    />
    <meta property="og:image" content="/hero.jpg" />
    <meta property="og:url" content="https://nata.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="NATA — National Association of Tattoo Artists"
    />
    <meta
      name="twitter:description"
      content="Health insurance, life insurance, and exclusive benefits for tattoo artists and piercers nationwide."
    />
    <meta name="twitter:image" content="/hero.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
